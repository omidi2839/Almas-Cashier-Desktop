name: Build Almas Cashier Windows
on:
  workflow_dispatch:
  push:
    tags:
      - cashier-v*
jobs:
  windows-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained x64 app
        shell: pwsh
        run: |
          dotnet publish AlmasCashierDesktop/AlmasCashierDesktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/publish
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Setup EXE
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/AlmasCashier.iss
      - uses: actions/upload-artifact@v4
        with:
          name: AlmasCashierDesktop_v0.1.0_Windows_x64
          path: |
            artifacts/installer/*.exe
            artifacts/publish/*.exe
          if-no-files-found: error
